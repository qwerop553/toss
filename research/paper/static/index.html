<!doctype html>
<meta charset="utf-8">
<title>모의투자</title>
<!-- Pretendard. 실패해도 아래 font-family의 system-ui로 자연히 떨어지므로
     차트 CDN과 달리 onerror 처리가 따로 필요 없다. -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  /* 토스증권 톤: 회색 배경 위에 흰 카드, 테두리 대신 여백으로 구분한다.
     상승·매수는 빨강, 하락·매도는 파랑 (국내 관행). */
  :root {
    --bg:#f2f4f6; --card:#fff; --text:#191f28; --sub:#4e5968; --muted:#8b95a1;
    --field:#f2f4f6; --up:#f04452; --down:#3182f6; --radius:16px;
  }
  * { box-sizing: border-box; }
  body {
    margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 "Pretendard Variable", Pretendard, system-ui, "Malgun Gothic", sans-serif;
    /* 시세가 갱신될 때 자릿수마다 폭이 달라 숫자가 덜컹거리는 걸 막는다. */
    font-variant-numeric: tabular-nums;
  }

  /* ---- 상단 알림. 배너는 상태(계속 떠 있음), notice는 1회성 이벤트다. */
  #banner { display:none; padding:12px 20px; background:var(--up); color:#fff; font-weight:600; }
  #banner.on { display:block; }
  #notice { display:none; padding:10px 20px; background:#fff8e1; color:#8a6d00; font-size:13px; }
  #notice.on { display:block; }

  /* ---- 3열 레이아웃. 카드 사이 간격은 gap이 만들고, 예전처럼 pane마다
         스크롤을 따로 두지 않고 페이지 전체가 스크롤된다. */
  #grid {
    display:grid; grid-template-columns:260px minmax(0, 1fr) 340px;
    gap:16px; padding:16px; align-items:start;
    /* 와이드 모니터에서 가운데 열이 끝없이 늘어나면 호가의 가격과 잔량이
       화면 양 끝으로 벌어져 한눈에 안 들어온다. */
    max-width:1440px; margin:0 auto;
  }
  .pane { display:flex; flex-direction:column; gap:16px; min-width:0; }
  .card { background:var(--card); border-radius:var(--radius); padding:20px;
          box-shadow:0 1px 3px rgba(0,0,0,.04); }

  h2 { font-size:13px; color:var(--muted); font-weight:600; margin:0 0 12px; }

  /* ---- 종목 헤더. 토스처럼 현재가를 크게 놓고 등락을 바로 아래 붙인다. */
  #name { font-size:19px; font-weight:700; }
  #code { font-size:13px; color:var(--muted); font-weight:500; margin-left:6px; }
  #price { font-size:34px; font-weight:700; letter-spacing:-.02em; margin-top:8px; }
  #change { font-size:14px; font-weight:600; margin-top:2px; min-height:21px; color:var(--muted); }

  table { width:100%; border-collapse:collapse; }
  td, th { padding:7px 8px; text-align:right; white-space:nowrap; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  td:first-child, th:first-child { text-align:left; }

  /* ---- 관심종목 */
  #watch tr { cursor:pointer; }
  #watch tr:hover { background:var(--field); }
  #watch tr.sel { background:#e8f3ff; }
  #watch td { border-radius:8px; }
  #watch .nm { font-weight:600; }
  #watch .del { background:none; border:0; color:var(--muted); font-size:15px;
                padding:0 4px; visibility:hidden; }
  #watch tr:hover .del { visibility:visible; }

  /* ---- 호가. 잔량 칸 배경에 최대 잔량 대비 비율만큼 막대를 깐다.
         asks는 오른쪽 칸이라 오른쪽 끝에서 왼쪽으로, bids는 그 반대로 자란다. */
  .book { max-width:460px; margin:0 auto; }
  .book td { padding:5px 8px; }
  .book .price { width:40%; text-align:center; cursor:pointer; font-weight:600; }
  .book .vol { color:var(--muted); font-size:12px; }
  .ask .price { color:var(--down); }
  .bid .price { color:var(--up); }
  .book tr:hover .price { text-decoration:underline; }

  /* ---- 입력·버튼 */
  input, select {
    width:100%; font:inherit; padding:11px 14px; border:0; border-radius:12px;
    background:var(--field); color:var(--text);
  }
  input:focus, select:focus { outline:2px solid var(--down); outline-offset:-2px; }
  button { cursor:pointer; font:inherit; }
  .field { margin-bottom:8px; }
  .field label { display:block; font-size:12px; color:var(--muted); margin:0 0 4px 2px; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  .buy, .sell { flex:1; height:48px; border:0; border-radius:12px; color:#fff;
                font-size:15px; font-weight:700; }
  .buy { background:var(--up); } .sell { background:var(--down); }
  .buy:hover { background:#d63c48; } .sell:hover { background:#2b74dd; }
  .del:hover { color:var(--text); }

  #chart { height:260px; margin-top:16px; }
  .note { color:var(--muted); font-size:12px; margin-top:6px; min-height:16px; }
  .err { color:var(--up); font-size:13px; min-height:19px; margin-top:8px; }
  .empty { color:var(--muted); font-size:13px; padding:4px 2px; }

  .pos { color:var(--up); } .neg { color:var(--down); }

  /* ---- 현금 요약. 라벨은 왼쪽 회색, 금액은 오른쪽 정렬로 붙인다. */
  .cash-row { display:flex; justify-content:space-between; padding:5px 2px; }
  .cash-row span:first-child { color:var(--muted); }
  .cash-row span:last-child { font-weight:600; }
</style>

<div id="banner"></div>
<div id="notice"></div>
<div id="grid">
  <div class="pane">
    <div class="card">
      <input id="add" placeholder="종목코드 추가 (예 005930)">
    </div>
    <div class="card">
      <h2>관심종목</h2>
      <table><tbody id="watch"></tbody></table>
    </div>
  </div>

  <div class="pane">
    <div class="card">
      <div><span id="name">종목을 고르세요</span><span id="code"></span></div>
      <div id="price">—</div>
      <div id="change"></div>
      <div id="chart"></div>
      <div class="note" id="candlesNote"></div>
    </div>
    <div class="card">
      <h2>호가</h2>
      <table class="book"><tbody id="book"></tbody></table>
    </div>
  </div>

  <div class="pane">
    <div class="card">
      <h2>주문</h2>
      <div class="field"><label>유형</label>
        <select id="otype"><option value="limit">지정가</option><option value="market">시장가</option></select>
      </div>
      <div class="field"><label>가격</label><input id="oprice" type="number" step="1"></div>
      <div class="field"><label>수량</label><input id="oqty" type="number" min="1" value="1"></div>
      <div class="actions">
        <button class="buy" onclick="order('buy')">매수</button>
        <button class="sell" onclick="order('sell')">매도</button>
      </div>
      <div class="err" id="err"></div>
    </div>

    <div class="card">
      <h2>미체결</h2>
      <table><tbody id="open"></tbody></table>
    </div>

    <div class="card">
      <h2>보유</h2>
      <table>
        <tr><th>종목</th><th>수량</th><th>평단</th><th>손익</th></tr>
        <tbody id="pos"></tbody>
      </table>
    </div>

    <div class="card">
      <h2>현금</h2>
      <div id="cash"></div>
    </div>
  </div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"
        onerror="window.__nochart=1"></script>
<script>
// null/undefined는 "값을 모른다"는 뜻이라 0으로 뭉개면 안 된다 (예: 미체결
// 시장가 주문의 limit_price, 시세를 아직 못 받은 보유 종목의 price/pnl).
// 대시로 표시해 숫자 0과 구분한다.
const won = n => n == null ? "—" : n.toLocaleString("ko-KR");
// 서버에서 온 문자열(종목코드·종목명)을 innerHTML/속성값에 꽂기 전에 이스케이프한다.
// symbol은 관심종목 추가창의 자유 입력이라 서버 쪽 검증이 없다 — 어포스트로피
// 하나로 onclick="select('${...}')" 속성이 깨지면 화면이 설명 없이 이상해진다.
const esc = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let symbol = null, series = null, chart = null;
// 종목코드 -> 종목명. select()는 코드만 받는데 헤더에는 이름을 보여야 해서
// 관심종목을 그릴 때 지나가는 이름을 여기 담아 둔다. 없으면 코드를 쓴다.
const names = {};
// 전일 종가. 등락을 계산하려면 필요한데 /api/quote에는 없어서 차트용으로
// 이미 받아오는 캔들에서 뽑는다. 캔들을 못 받으면 null로 두고 등락을 숨긴다.
let prevClose = null;

// ---- 연결 상태 배너. connected가 아닌 모든 상태에서 "지정가 체결이
// 멈췄다"는 결론을 먼저 말해야 한다 — error 상태(구독 선언 실패 등)도
// reconnecting과 똑같이 체결 판정이 멈추는 상황이라 예외로 두면 안 된다.
function banner(status, message) {
  const el = document.getElementById("banner");
  if (status === "connected") { el.className = ""; return; }
  el.className = "on";
  const why = status === "reconnecting" ? "실시간 연결 끊김 — 재접속 중"
            : status === "error"        ? "실시간 연결 오류"
            : "실시간 연결 준비 중";
  el.textContent = `${why} — 지정가 체결이 중단됩니다.` + (message ? ` (${message})` : "");
}

// ---- 잠깐 떴다 사라지는 안내(장 마감 만료 등). 배너와 달리 상태가 아니라
// 1회성 이벤트라 몇 초 후 자동으로 닫는다.
let noticeTimer = null;
function notice(msg) {
  const el = document.getElementById("notice");
  el.textContent = msg;
  el.className = "on";
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { el.className = ""; }, 6000);
}

// ---- 차트. CDN이 막히면 차트만 빠지고 매매는 계속 된다.
function initChart() {
  if (window.__nochart || !window.LightweightCharts) {
    document.getElementById("chart").textContent = "차트를 불러오지 못했습니다 (매매는 정상)";
    return null;
  }
  const el = document.getElementById("chart");
  chart = LightweightCharts.createChart(el, {
    height: 260,
    layout: { attributionLogo: false, background: { color: "#fff" }, textColor: "#8b95a1" },
    grid: { vertLines: { visible: false }, horzLines: { color: "#f2f4f6" } },
    rightPriceScale: { borderVisible: false },
    timeScale: { borderVisible: false, timeVisible: true, secondsVisible: false },
    localization: { locale: "ko-KR" },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  });
  // createChart는 만들 때의 폭으로 고정된다. 3열 그리드라 창을 줄이면 차트만
  // 카드 밖으로 삐져나가므로 컨테이너 폭을 따라가게 붙여 둔다.
  new ResizeObserver(([e]) => chart.applyOptions({ width: e.contentRect.width })).observe(el);
  return chart.addCandlestickSeries({
    upColor: "#f04452", downColor: "#3182f6", borderVisible: false,
    wickUpColor: "#f04452", wickDownColor: "#3182f6",
  });
}

// ---- 헤더의 현재가와 등락. 전일 종가를 모르면 등락 줄은 비워 둔다
// (0으로 뭉개면 "보합"이라는 없는 정보를 만들어 낸다).
function setPrice(p) {
  document.getElementById("price").textContent = p == null ? "—" : won(p) + "원";
  const el = document.getElementById("change");
  if (p == null || prevClose == null) { el.textContent = ""; el.className = ""; return; }
  const diff = p - prevClose;
  const pct = (diff / prevClose * 100).toFixed(2);
  el.className = diff === 0 ? "" : (diff > 0 ? "pos" : "neg");
  const arrow = diff === 0 ? "" : (diff > 0 ? "▲ " : "▼ ");
  el.textContent = `${arrow}${won(Math.abs(diff))}원 (${diff > 0 ? "+" : diff < 0 ? "-" : ""}${Math.abs(pct)}%)`;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const body = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(body.detail || r.statusText);
  // /api/candles는 캔들 수집이 실패해도 본문은 그대로 배열을 돌려주고(차트
  // 코드가 바로 map()으로 소비하므로 형태를 바꾸면 안 된다) 실패 사실만 이
  // 헤더에 담아 보낸다. 치명적이지 않으니(예전 캔들이 남아 있을 수 있다)
  // 차트 옆에 작은 안내만 띄운다.
  const candlesErr = r.headers.get("X-Candles-Error");
  if (candlesErr) {
    document.getElementById("candlesNote").textContent =
      "최신 분봉을 갱신하지 못했습니다 — 이전에 저장된 캔들을 표시합니다.";
  }
  return body;
}

async function loadWatch() {
  const rows = await api("/api/watchlist");
  rows.forEach(r => { names[r.symbol] = r.name; });
  // 종목명은 관심종목 응답에만 있다. portfolio 푸시가 먼저 도착했으면 그때는
  // 이름을 몰라 코드로 그려졌으므로, 이름이 생긴 지금 한 번 다시 그린다.
  if (lastPortfolio) drawPortfolio(lastPortfolio);
  // 행마다 onclick 문자열을 조립하지 않는다. HTML 속성값은 인라인 핸들러의
  // JS로 컴파일되기 전에 엔티티 디코딩되므로("&#39;" → "'"), esc()를 거쳐도
  // onclick="select('...')" 안에서는 문자열을 탈출할 수 있다 — 값은 data
  // 속성으로만 넘기고 핸들러는 코드로 붙인다(아래 watchClick 델리게이션).
  document.getElementById("watch").innerHTML = rows.map(r => `
    <tr class="${r.symbol === symbol ? "sel" : ""}" data-symbol="${esc(r.symbol)}">
      <td class="nm">${esc(r.name)}</td><td>${won(r.price)}</td>
      <td><button class="del" data-symbol="${esc(r.symbol)}" title="삭제">×</button></td>
    </tr>`).join("");
}

// ---- 관심종목 목록에 위임 리스너 하나만 붙인다. loadWatch()가 매번
// innerHTML을 다시 그리므로, 리스너를 그 안에서 붙이면 다시 그릴 때마다
// 리스너가 겹겹이 쌓여 클릭 한 번에 핸들러가 N번 불린다 — 시작할 때 한 번만.
document.getElementById("watch").addEventListener("click", ev => {
  const del = ev.target.closest("button.del");
  if (del) { ev.stopPropagation(); remove(del.dataset.symbol); return; }
  const row = ev.target.closest("tr[data-symbol]");
  if (row) select(row.dataset.symbol);
});

async function select(s) {
  symbol = s;
  document.getElementById("name").textContent = names[s] || s;
  document.getElementById("code").textContent = s;
  document.getElementById("candlesNote").textContent = "";
  // 종목이 바뀌면 이전 종목의 전일 종가로 등락을 계산하지 않도록 먼저 지운다.
  prevClose = null;
  setPrice(null);
  await loadWatch();
  await loadBook();
  if (series) {
    const candles = await api("/api/candles?symbol=" + s);
    // lightweight-charts는 시각 눈금을 무조건 UTC로 찍는다(타임존 옵션이 없다).
    // 그대로 넣으면 14:12 봉이 05:12로 보이므로, KST만큼 미리 밀어 넣어
    // UTC로 찍힌 눈금이 한국 시각과 맞게 만든다. 캔들은 전부 KRX 장중 데이터라
    // 오프셋이 +09:00으로 고정이고 서머타임도 없다.
    const KST = 9 * 3600;
    series.setData(candles.map(c => ({
      time: Math.floor(new Date(c.time).getTime() / 1000) + KST,
      open: c.open, high: c.high, low: c.low, close: c.close })));
    prevClose = prevDayClose(candles);
    // 호가를 먼저 그렸을 때는 전일 종가를 몰라 등락을 비워 뒀으므로 다시 그린다.
    if (lastPrice != null) setPrice(lastPrice);
  }
}

// 분봉 배열에서 '마지막 봉의 날짜와 다른' 마지막 봉의 종가를 찾는다. 그게
// 전일 종가다. 하루치밖에 없으면 비교 대상이 없어 null을 낸다.
function prevDayClose(candles) {
  if (!candles.length) return null;
  const today = candles[candles.length - 1].time.slice(0, 10);
  for (let i = candles.length - 1; i >= 0; i--) {
    if (candles[i].time.slice(0, 10) !== today) return candles[i].close;
  }
  return null;
}

let lastPrice = null;

async function loadBook() {
  if (!symbol) return;
  const q = await api("/api/quote?symbol=" + symbol);
  // 현재가는 /api/quote에만 들어 있다. 웹소켓 orderbook 메시지에는 없으므로
  // drawBook이 아니라 여기서 헤더를 갱신한다.
  lastPrice = q.price;
  setPrice(q.price);
  drawBook(q);
}

function drawBook(q) {
  // 잔량 막대는 화면에 보이는 호가 중 최대 잔량을 100%로 잡는다. 전체 시장
  // 기준이 아니라 상대 비교라, 어느 호가에 물량이 몰렸는지만 보면 된다.
  const max = Math.max(1, ...q.asks.map(l => l[1]), ...q.bids.map(l => l[1]));
  const bar = (v, dir, color) =>
    `background:linear-gradient(to ${dir}, ${color} ${(v / max * 100).toFixed(1)}%, transparent 0)`;
  const ask = [...q.asks].reverse().map(([p, v]) => `
    <tr class="ask"><td class="vol"></td>
        <td class="price" onclick="pick(${p})">${won(p)}</td>
        <td class="vol" style="${bar(v, "left", "rgba(49,130,246,.16)")}">${won(v)}</td></tr>`);
  const bid = q.bids.map(([p, v]) => `
    <tr class="bid"><td class="vol" style="${bar(v, "right", "rgba(240,68,82,.16)")}">${won(v)}</td>
        <td class="price" onclick="pick(${p})">${won(p)}</td>
        <td class="vol"></td></tr>`);
  document.getElementById("book").innerHTML = ask.join("") + bid.join("");
}

const pick = p => document.getElementById("oprice").value = p;

async function order(side) {
  const err = document.getElementById("err");
  err.textContent = "";
  if (!symbol) { err.textContent = "종목을 먼저 고르세요."; return; }
  const type = document.getElementById("otype").value;
  const body = { symbol, side, type, qty: +document.getElementById("oqty").value };
  if (type === "limit") body.limit_price = +document.getElementById("oprice").value;
  try {
    await api("/api/orders", { method: "POST",
      headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    await loadOpen();
  } catch (e) { err.textContent = e.message; }
}

async function loadOpen() {
  const rows = await api("/api/orders?status=pending");
  const el = document.getElementById("open");
  if (!rows.length) { el.innerHTML = `<tr><td class="empty" colspan="5">없음</td></tr>`; return; }
  el.innerHTML = rows.map(o => `
    <tr><td>${esc(o.symbol)}</td>
        <td class="${o.side === "buy" ? "pos" : "neg"}">${o.side === "buy" ? "매수" : "매도"}</td>
        <td>${won(o.limit_price)}</td>
        <td>${o.filled_qty}/${o.qty}</td>
        <td><button class="del" onclick="cancel(${o.id})" title="취소">×</button></td></tr>`).join("");
}

async function cancel(id) {
  // DELETE는 이미 종료된 주문 등을 400 + detail로 거절할 수 있다. 잡지
  // 않으면 클릭이 아무 설명 없이 그냥 씹힌다 — order()와 같은 패턴으로 처리.
  try {
    await api("/api/orders/" + id, { method: "DELETE" });
    await loadOpen();
  } catch (e) { document.getElementById("err").textContent = e.message; }
}

async function remove(s) {
  try {
    await api("/api/watchlist", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol: s, action: "remove" }) });
    if (symbol === s) symbol = null;
    await loadWatch();
  } catch (e) { document.getElementById("err").textContent = e.message; }
}

document.getElementById("add").addEventListener("keydown", async e => {
  if (e.key !== "Enter") return;
  const s = e.target.value.trim();
  if (!s) return;
  try {
    await api("/api/watchlist", { method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ symbol: s, action: "add" }) });
    e.target.value = "";
    await loadWatch();
  } catch (err) { document.getElementById("err").textContent = err.message; }
});

let lastPortfolio = null;

function drawPortfolio(p) {
  lastPortfolio = p;
  const el = document.getElementById("pos");
  if (!p.positions.length) {
    el.innerHTML = `<tr><td class="empty" colspan="4">없음</td></tr>`;
  } else {
    el.innerHTML = p.positions.map(x => {
      // price/pnl/pnl_pct는 아직 시세를 못 받은 보유 종목이면 null로 온다
      // (0으로 뭉치면 "-100% 손실"처럼 없는 손실이 찍힌다). 그럴 땐 대시만
      // 보여주고 빨강/파랑 색도 칠하지 않는다.
      const cls = x.pnl == null ? "" : (x.pnl >= 0 ? "pos" : "neg");
      const pnl = x.pnl == null ? "—" : `${won(x.pnl)} (${x.pnl_pct}%)`;
      return `<tr><td>${esc(names[x.symbol] || x.symbol)}</td><td>${x.qty}</td>
          <td>${won(x.avg_cost)}</td><td class="${cls}">${pnl}</td></tr>`;
    }).join("");
  }
  document.getElementById("cash").innerHTML = `
    <div class="cash-row"><span>보유현금</span><span>${won(p.cash)}원</span></div>
    <div class="cash-row"><span>주문가능</span><span>${won(p.available)}원</span></div>
    <div class="cash-row"><span>주문묶임</span><span>${won(p.reserved)}원</span></div>`;
}

// ---- 서버 푸시
const ws = new WebSocket(`ws://${location.host}/ws`);
ws.onmessage = ev => {
  const m = JSON.parse(ev.data);
  if (m.type === "feed") banner(m.status, m.message);
  else if (m.type === "portfolio") drawPortfolio(m);
  else if (m.type === "orderbook" && m.symbol === symbol) drawBook(m);
  else if (m.type === "trade") {
    // 체결 프린트가 현재가의 실시간 소스다. 헤더는 여기서 갱신하고,
    // 관심종목 목록은 서버를 다시 부르므로 2초에 한 번으로 묶는다.
    if (m.symbol === symbol) { lastPrice = m.price; setPrice(m.price); loadWatchThrottled(); }
  }
  else if (m.type === "fill") { loadOpen(); }
  else if (m.type === "expired") {
    loadOpen();
    notice("장 마감으로 미체결 주문이 만료되었습니다.");
  }
};
ws.onclose = () => banner("reconnecting", "브라우저 연결이 끊겼습니다. 새로고침하세요.");

let watchTimer = null;
function loadWatchThrottled() {
  if (watchTimer) return;
  watchTimer = setTimeout(() => { watchTimer = null; loadWatch(); }, 2000);
}

series = initChart();
loadWatch();
loadOpen();
</script>
