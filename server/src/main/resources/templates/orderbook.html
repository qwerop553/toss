<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>실시간 호가</title>
    <style>
        body { font-family: sans-serif; }
        table { border-collapse: collapse; width: 420px; }
        td { padding: 3px 10px; font-variant-numeric: tabular-nums; }
        .price { width: 90px; text-align: center; font-weight: bold; cursor: pointer; }
        #order-form { margin-top: 16px; }
        #order-form input, #order-form select { font-size: 1em; padding: 2px 4px; }
        tr.ask .price { color: #2563eb; }
        tr.bid .price { color: #dc2626; }
        /* 수량 칸은 항상 존재하고, 막대는 background로만 그린다(별도 DOM 없음).
           내 편이 아닌 쪽(예: 매도 행의 매수 수량 칸)은 그냥 비워둔다. */
        .qty { width: 165px; color: #555; }
        .qty.ask { text-align: left; }
        .qty.bid { text-align: right; }
        /* 시그널 배너. 색은 호가창과 같은 규칙을 그대로 쓴다 — 매수는 빨강,
           매도는 파랑. 화면 안에서 같은 뜻에 다른 색을 쓰면 그 자체가 오독의
           원인이 된다. 폭을 표와 맞춰 두면 배너가 떴다 사라져도 표가
           좌우로 흔들리지 않는다. */
        #signal-banner { width: 420px; box-sizing: border-box; margin: 10px 0; padding: 8px 10px;
                         border-radius: 4px; font-size: 0.95em; }
        #signal-banner.BUY { background: #fee2e2; color: #991b1b; border: 1px solid #dc2626; }
        #signal-banner.SELL { background: #dbeafe; color: #1e40af; border: 1px solid #2563eb; }
        #signal-banner .note { display: block; margin-top: 3px; color: #444; font-size: 0.9em; }
    </style>
</head>
<body>

<h1>실시간 호가 — 삼성전자(005930)</h1>

<div id="signal-banner" hidden></div>

<table>
    <tbody id="ladder"></tbody>
</table>

<div id="order-form">
    <select id="side"><option value="BUY">매수</option><option value="SELL">매도</option></select>
    가격 <input id="price" type="number">
    수량 <input id="quantity" type="number" value="1" min="1">
    <button onclick="placeOrder()">지정가 주문</button>
</div>

<script>
  const ws = new WebSocket(`ws://${location.host}/ws`);

  // 이 소켓 하나로 여러 종류의 메시지가 섞여 온다(호가·체결·시그널). 게다가
  // 이 화면 말고 파이썬 러너도 같은 소켓을 구독하기 때문에, 이 화면과 상관
  // 없는 type이 앞으로 더 늘어날 수 있다. 그래서 아는 type만 처리하고
  // 나머지는 조용히 무시한다 — 모르는 메시지에 렌더링을 시도하면(예: 체결
  // 메시지에 asks가 없다) 그 자리에서 예외가 나고 호가 표가 멈춘다.
  ws.onmessage = (event) => {
    const msg = JSON.parse(event.data);
    if (msg.type === "orderbook") render(msg.asks, msg.bids);
    else if (msg.type === "signal") showSignal(msg);
    // 체결(trade)은 파이썬 러너용이라 이 화면에선 쓰지 않는다. 호가창에
    // 이미 같은 정보가 보이고, 초당 수십 건씩 오는 걸 화면에 흘리면
    // 정작 중요한 시그널 배너를 가린다.
  };

  // 배너는 자동으로 사라지지 않는다. 타이머로 지우면 잠깐 자리를 비운 사이
  // 시그널이 왔다 간 걸 영영 모르게 된다. 다음 시그널이 오면 어차피
  // 덮어쓰이므로 "가장 최근 시그널이 항상 떠 있다"가 더 유용하다.
  function showSignal(signal) {
    const banner = document.getElementById("signal-banner");
    banner.className = signal.side;   // BUY/SELL이 그대로 CSS 클래스가 된다
    const time = new Date(signal.timestamp).toLocaleTimeString("ko-KR");
    const label = signal.side === "BUY" ? "매수" : "매도";

    // innerHTML이 아니라 textContent로 채운다. note와 strategy는 파이썬
    // 프로세스가 준 값이라 이 페이지 입장에선 외부 입력이고, 거기에 태그가
    // 섞여 있으면 innerHTML은 그걸 실행 가능한 마크업으로 해석한다.
    banner.textContent =
      `${label} 시그널 · ${signal.stockCode} · ${signal.price.toLocaleString()}원 · ${signal.strategy} · ${time}`;
    if (signal.note) {
      const note = document.createElement("span");
      note.className = "note";
      note.textContent = signal.note;
      banner.appendChild(note);
    }
    banner.hidden = false;
  }

  function render(asks, bids) {
    // 서버가 준 배열 순서를 믿지 않고 매번 여기서 다시 정렬한다 — 설계
    // 문서에 적혀 있던 "배열 순서에 의존하지 않는다"는 원칙을 화면 쪽도
    // 그대로 따른다. 매도호가는 위에서부터 비싼 값 → 최우선(가장 싼 값)
    // 순, 매수호가는 위에서부터 최우선(가장 비싼 값) → 싼 값 순으로 두면
    // 두 목록이 이어 붙었을 때 가운데가 스프레드(최우선 매도/매수)가 된다.
    const askRows = [...asks].sort((a, b) => b.price - a.price);
    const bidRows = [...bids].sort((a, b) => b.price - a.price);

    // 막대 길이를 서로 비교 가능하게 하려면 매도·매수 통틀어 하나의
    // 기준(최대 수량)으로 정규화해야 한다. 각자 따로 100%를 잡으면 얇은
    // 쪽 최대 수량이 굵은 쪽 최소 수량보다 굵게 그려지는 착시가 생긴다.
    const maxVolume = Math.max(...askRows.map(l => l.volume), ...bidRows.map(l => l.volume));

    const tbody = document.getElementById("ladder");
    tbody.innerHTML = "";
    for (const level of askRows) tbody.appendChild(row(level, "ask", maxVolume));
    for (const level of bidRows) tbody.appendChild(row(level, "bid", maxVolume));
  }

  function row(level, side, maxVolume) {
    const tr = document.createElement("tr");
    tr.className = side;
    tr.innerHTML = `
      <td class="qty bid">${side === "bid" ? cell(level, "bid", maxVolume) : ""}</td>
      <td class="price">${level.price.toLocaleString()}</td>
      <td class="qty ask">${side === "ask" ? cell(level, "ask", maxVolume) : ""}</td>
    `;
    if (side === "bid") tr.children[0].style.background = bar(level.volume, maxVolume, "left", "#fee2e2");
    if (side === "ask") tr.children[2].style.background = bar(level.volume, maxVolume, "right", "#dbeafe");
    // 가격 칸을 누르면 그 값이 주문 폼의 가격 입력창에 채워진다. 수량은
    // 사용자가 정해야 하니 여기서 건드리지 않는다 — "바로 매수 가능"은
    // "즉시 체결"이 아니라 "가격 입력을 안 해도 된다"는 뜻이다(지정가만
    // 쓰기로 했으므로 클릭해도 대기 주문으로 들어간다).
    tr.querySelector(".price").onclick = () => {
      document.getElementById("price").value = level.price;
    };
    return tr;
  }

  function cell(level) {
    return level.volume.toLocaleString();
  }

  // 막대는 실제 <div>를 안 그리고, 두 지점에서 색이 뚝 끊기는
  // linear-gradient 하나로 흉내낸다 — 행마다 DOM 노드를 추가할 필요가
  // 없어서 더 가볍다. side가 매도(ask)면 가격 칸에 붙은 왼쪽 끝에서
  // 시작해 오른쪽으로, 매수(bid)면 오른쪽 끝에서 시작해 왼쪽으로 채운다.
  function bar(volume, maxVolume, direction, color) {
    const pct = Math.round((volume / maxVolume) * 100);
    return `linear-gradient(to ${direction}, ${color} 0 ${pct}%, transparent ${pct}%)`;
  }

  function placeOrder() {
    const order = {
      stockCode: "005930",
      side: document.getElementById("side").value,
      price: Number(document.getElementById("price").value),
      quantity: Number(document.getElementById("quantity").value),
    };
    fetch("/api/orders", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(order),
    })
      // 성공/실패 둘 다 body가 JSON이라, 상태코드(res.ok)와 body를 같이
      // 들고 다음 단계로 넘긴다.
      .then((res) => res.json().then((body) => ({ ok: res.ok, body })))
      .then(({ ok, body }) => {
        alert(ok ? `주문 접수됨 (#${body.id}, ${body.status})` : `주문 실패: ${body.error}`);
      });
  }
</script>

</body>
</html>
