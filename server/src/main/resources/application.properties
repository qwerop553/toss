spring.application.name=demo

toss.base-url=https://openapi.tossinvest.com/api/v1

# 재시작해도 잔고·보유종목·주문이 남아있어야 해서 파일 모드로 연다(인메모리면
# 앱을 끄는 순간 다 날아간다). ddl-auto=update는 학습용 프로젝트라 마이그레이션
# 도구(Flyway 등) 없이 엔티티 변경사항을 자동으로 테이블에 반영한다.
spring.datasource.url=jdbc:h2:file:./data/paper;AUTO_SERVER=TRUE
spring.jpa.hibernate.ddl-auto=update
